name: CI

on:
  pull_request:
  push:
    branches: main

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup
        uses: ./.github/actions/setup

      - name: Test
        run: npm test

      - name: Coverage
        run: npm run coverage

      - name: Typecheck
        run: npm run typecheck

  code-style:
    name: Code Style
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup
        uses: ./.github/actions/setup

      - name: Format
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Dead Code
        run: npm run dead-code

      # Fails on dead links, and on docs examples that no longer type-check against `src`.
      - name: Docs
        run: npm run docs:build

  prerelease:
    name: Prerelease
    needs: [test, code-style]
    if: github.event_name == 'push'
    uses: ./.github/workflows/release.yml
    # The release redeploys the docs, which needs Pages access.
    permissions:
      contents: write
      pages: write
      id-token: write
    secrets: inherit
    with:
      release: prerelease
