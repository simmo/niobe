name: Release

concurrency:
  group: release

# Publishes to npm with trusted publishing (OIDC), so no npm token is stored. npm only accepts
# a publish from the workflow it trusts, which is this file, so it must run on its own rather
# than being called from ci.yml.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      release:
        default: prerelease
        description: 'Type'
        options:
          - prerelease
          - prepatch
          - preminor
          - premajor
          - patch
          - minor
          - major
        required: true
        type: choice
      dry-run:
        default: false
        description: 'Dry Run'
        type: boolean

permissions:
  contents: write
  id-token: write

env:
  RELEASE: ${{ inputs.release || 'prerelease' }}

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    outputs:
      # The Release step may fail without failing the job (prereleases), so check its outcome.
      released: ${{ steps.release.outcome == 'success' && inputs.dry-run != true }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_branch || github.ref }}
          # Full history, so the tested commit can be compared with the branch.
          fetch-depth: 0

      # Release only code CI tested. release-it needs the branch (not a detached SHA) to push
      # its release commit, so compare instead. Any change since the tested commit came from a
      # push with its own CI run, which releases it.
      - name: Check Commit
        id: commit
        if: github.event_name == 'workflow_run'
        run: |
          if git diff --quiet "${{ github.event.workflow_run.head_sha }}" HEAD; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "main has changed since ${{ github.event.workflow_run.head_sha }}; skipping."
            echo "current=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup
        if: steps.commit.outputs.current != 'false'
        uses: ./.github/actions/setup

      - name: Build
        if: steps.commit.outputs.current != 'false'
        run: npm run build

      - name: Release
        id: release
        if: steps.commit.outputs.current != 'false'
        continue-on-error: ${{ env.RELEASE == 'prerelease' }}
        run: npm run release -- ${{ env.RELEASE }} --ci ${{ contains(fromJSON('["premajor", "preminor", "prepatch", "prerelease"]'), env.RELEASE) && '--preRelease=beta --plugins.@release-it/keep-a-changelog.keepUnreleased' || '' }} --dry-run=${{ inputs.dry-run || false }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Every release (prereleases included, for /next/) redeploys the docs. Called rather than
  # triggered, because tags pushed with GITHUB_TOKEN don't start other workflows.
  docs:
    name: Docs
    needs: release
    if: needs.release.outputs.released == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/docs.yml
